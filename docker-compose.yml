name: walhi-jabar

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: walhi_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=WALHI Jabar
      - APP_ENV=local
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
      - APP_KEY=
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/html/storage/app/database.sqlite
      - SESSION_DRIVER=file
      - CACHE_STORE=file
      - QUEUE_CONNECTION=sync
      - LOG_CHANNEL=stack
      - LOG_LEVEL=debug
      - SEED_ON_START=true
    volumes:
      # Only persist the SQLite database — NOT the entire storage/ directory
      # This prevents volume shadowing of storage/framework/* dirs built into the image
      - walhi_db:/var/www/html/storage/app
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--no-ansi"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  walhi_db:
