# ─────────────────────────────────────────────────────────────
# WALHI Jawa Barat — Production Docker Compose Configuration
# ─────────────────────────────────────────────────────────────

services:
  # ── 1. Application Service (Laravel 12 / PHP 8.4) ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: walhi_prod_app
    restart: always
    environment:
      APP_NAME: "${APP_NAME:-WALHI Jawa Barat}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-https://walhijabar.or.id}"
      
      # Database Configuration
      DB_CONNECTION: "${DB_CONNECTION:-mysql}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-walhi_prod}"
      DB_USERNAME: "${DB_USERNAME:-walhi_user}"
      DB_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD wajib disetel di .env}"
      
      # Security & Session
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      SESSION_LIFETIME: "${SESSION_LIFETIME:-120}"
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      
      # Payment Gateway (Midtrans)
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY}"
      MIDTRANS_IS_PRODUCTION: "${MIDTRANS_IS_PRODUCTION:-true}"
      
      # Admin Seed & Migration Controls
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@walhijabar.or.id}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      SEED_ON_START: "${SEED_ON_START:-false}"
      MIGRATE_ON_START: "${MIGRATE_ON_START:-false}"
    deploy:
      resources:
        limits:
          cpus: '0.85'
          memory: 1536M
        reservations:
          cpus: '0.25'
          memory: 384M
    volumes:
      - walhi_prod_public:/var/www/html/public_shared
      - walhi_prod_storage:/var/www/html/storage/app/public
      - walhi_prod_logs:/var/www/html/storage/logs
    networks:
      - walhi_prod_net
    depends_on:
      db:
        condition: service_healthy

  # ── 2. Database Service (MySQL 8.0) ──
  db:
    image: mysql:8.0
    container_name: walhi_prod_db
    restart: always
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-walhi_prod}"
      MYSQL_USER: "${DB_USERNAME:-walhi_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?Error: DB_PASSWORD wajib disetel di .env}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Error: DB_ROOT_PASSWORD wajib disetel di .env}"
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 1280M
        reservations:
          cpus: '0.20'
          memory: 512M
    volumes:
      - walhi_prod_db:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    networks:
      - walhi_prod_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 3. Nginx Web Server & Reverse Proxy ──
  web:
    image: nginx:alpine
    container_name: walhi_prod_nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - walhi_prod_public:/var/www/html/public:ro
      - walhi_prod_storage:/var/www/html/storage/app/public:ro
    networks:
      - walhi_prod_net
    depends_on:
      - app

# ── Persistent Storage Volumes ──
volumes:
  walhi_prod_db:
    driver: local
  walhi_prod_storage:
    driver: local
  walhi_prod_logs:
    driver: local
  walhi_prod_public:
    driver: local

# ── Private Internal Network ──
networks:
  walhi_prod_net:
    driver: bridge
