server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Block direct execution of PHP in storage and assets directories
    location ~* ^/(storage|assets)/.*\.php$ {
        deny all;
        return 404;
    }

    # Block PHP-FPM internal status and ping endpoints from public exposure
    location ~ ^/(status|ping)$ {
        deny all;
        return 404;
    }

    # Static Assets Caching (1 Year)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Storage Symlink Access
    location ^~ /storage/ {
        alias /var/www/html/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Main Application Route
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Prevent Access to Hidden Files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Detect Cloudflare / Reverse Proxy HTTPS
    set $custom_https $https;
    if ($http_x_forwarded_proto = "https") {
        set $custom_https "on";
    }

    # PHP-FPM FastCGI Handler (Forward to App Container)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Responsive FastCGI timeouts to prevent worker starvation on 4 GB RAM VPS
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 60s;
        fastcgi_read_timeout 60s;

        # Buffer allocations
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # Cloudflare and Proxy Header Forwarding
        fastcgi_param HTTPS $custom_https if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto if_not_empty;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for if_not_empty;
        fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip if_not_empty;
    }

    error_page 404 /index.php;
}
