; WALHI Jawa Barat — PHP-FPM Pool Tuning for 4 GB RAM VPS
; ─────────────────────────────────────────────────────────────

[global]
; Keep PHP-FPM in the foreground for Docker container process management
daemonize = no

[www]
listen = 9000

; Dynamic process management tuned conservatively for 4 GB RAM
; Concurrency capacity: 8 concurrent workers (~30-50MB base each)
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 4
pm.max_requests = 500

; Prevent stuck workers from holding memory indefinitely (60s timeout)
request_terminate_timeout = 60s

; Logging & stream handling
catch_workers_output = yes
decorate_workers_output = no
